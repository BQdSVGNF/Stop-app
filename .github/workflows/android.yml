name: Compiler Tempo
on:
  push:
    branches: [tempo]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Tempo.apk
      - uses: actions/upload-artifact@v4
        with: {name: Tempo-apk, path: Tempo.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tempo
          name: Tempo (dernière version)
          target_commitish: tempo
          make_latest: false
          files: Tempo.apk
